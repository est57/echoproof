[workspace]
resolver = "3"
members = ["crates/echoproof-core", "crates/echoproof-cli", "examples/demo-shop"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/est57/echoproof"
homepage = "https://github.com/est57/echoproof"
keywords = ["testing", "regression", "replay", "api", "ai-agents"]
categories = ["development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
echoproof-core = { path = "crates/echoproof-core", version = "0.4.0" }

[profile.release]
strip = true
