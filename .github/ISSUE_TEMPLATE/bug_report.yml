name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The echoproof command and its output. Remove secrets and personal data first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `echoproof --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and the framework or language of the service under test
