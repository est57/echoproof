<rect width="900" height="469" rx="10" fill="#0d1117"/>
<rect width="900" height="30" rx="10" fill="#161b22"/><rect y="20" width="900" height="10" fill="#161b22"/>
<circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
<text x="450" y="19" fill="#8b949e" text-anchor="middle">echoproof: base vs PR on the same database</text>
<clipPath id="c0"><rect class="w0" x="18" y="38" height="19" width="0"/></clipPath><text x="18" y="52" fill="#79c0ff" clip-path="url(#c0)">$ echoproof check -s traffic.jsonl --base http://127.0.0.1:8001 -t http://127.0.0.1:8002 \</text>
<clipPath id="c1"><rect class="w1" x="18" y="57" height="19" width="0"/></clipPath><text x="18" y="71" fill="#79c0ff" clip-path="url(#c1)">    --intent &quot;Add a currency field (IDR) to the catalog response.&quot; --code-diff change.diff</text>
<text class="l2" x="18" y="90" fill="#8b949e">echoproof replay: 83 requests to http://127.0.0.1:8001 in 1.4s</text>
<text class="l3" x="18" y="109" fill="#8b949e">echoproof replay: 83 requests to http://127.0.0.1:8002 in 1.3s</text>
<text class="l4" x="18" y="128" fill="#8b949e">echoproof: judging 2 change groups against the intent with claude-opus-5-5</text>
<text class="l5" x="18" y="147" fill="#ff7b72">echoproof: REGRESSION - 83 exchanges, 5 changed, 78 unchanged</text>
<text class="l6" x="18" y="166" fill="#c9d1d9">  intent judged by claude-opus-5-5: The currency field is added as intended. The same</text>
<text class="l7" x="18" y="185" fill="#c9d1d9">  diff also changes the template argument passed to products(), which alters prices.</text>
<text class="l8" x="18" y="204" fill="#c9d1d9"></text>
<text class="l9" x="18" y="223" fill="#ff7b72">  x GET /catalog                5/5 changed (100.0%)  unexpected</text>
<text class="l10" x="18" y="242" fill="#c9d1d9">      behavior  value changed   $.result.products[*].price  (5 requests)</text>
<text class="l11" x="18" y="261" fill="#ff7b72">          [regression] The diff swaps the third argument of products() from</text>
<text class="l12" x="18" y="280" fill="#ff7b72">          $branchTemplateId to $branchId, which the intent never asks for.</text>
<text class="l13" x="18" y="299" fill="#e3b341">            $.result.products[1].price: 18000 -&gt; 22000</text>
<text class="l14" x="18" y="318" fill="#c9d1d9">      additive  added           $.result.currency  (5 requests)</text>
<text class="l15" x="18" y="337" fill="#7ee787">          [intended] Adding &#x27;currency&#x27; =&gt; &#x27;IDR&#x27; matches the intent.</text>
<text class="l16" x="18" y="356" fill="#c9d1d9"></text>
<text class="l17" x="18" y="375" fill="#8b949e">  - GET /branches               0/5 changed (0.0%)  unchanged</text>
<text class="l18" x="18" y="394" fill="#8b949e">  - GET /payment-methods        0/3 changed (0.0%)  unchanged</text>
<text class="l19" x="18" y="413" fill="#c9d1d9"></text>
<text class="l20" x="18" y="432" fill="#ff7b72">result: FAIL</text>
</svg>
